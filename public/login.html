<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Wishen</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <svg class="doodle doodle-cloud" style="top: 10%; left: 5%; width: 100px;" viewBox="0 0 24 24" fill="none" stroke="var(--accent-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>
    
    <nav class="navbar">
        <a href="index.html" class="nav-brand text-gradient">Wishen</a>
        <div class="nav-links">
            <a href="register.html" class="btn btn-outline">Sign Up</a>
        </div>
    </nav>

    <main class="auth-wrapper">
        <div class="glass-panel auth-card">
            <h2>Welcome Back <span class="doodle-text">♡</span></h2>
            <form id="loginForm" action="dashboard.html" method="GET">
                <div class="form-group">
                    <label for="email">Username or Email</label>
                    <input type="text" id="email" class="form-control" placeholder="jane_doe or you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    <a href="forgot-password.html" class="forgot-pw-link">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
            </form>
            <div class="auth-links">
                <p>Don't have an account? <a href="register.html">Sign up</a></p>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
